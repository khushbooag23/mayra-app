server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Load-balancer / orchestrator health check
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Long-cache fingerprinted build assets
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every unknown path still resolves to index.html,
    # where the React Router catch-all route lands the visitor on Home.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
